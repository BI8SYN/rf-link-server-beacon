name: beacon-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAS_SERVER_UID: '20'
      SAS_SERVER_CALLSIGN: AB1CD
      SAS_MQTT_HOST: mqtt.example.com
      SAS_MQTT_PORT: '1883'
      SAS_CERT_FINGERPRINT: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      SAS_ISSUER_SN: '10'
      EMQX_DASHBOARD_PASSWORD: ci-config-validation-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go mod verify
      - run: sh -n beacon.sh && sh -n deploy/native/download.sh && sh -n deploy/systemd/install.sh
      - run: docker compose config --quiet
      - run: docker compose -f compose.beacon.yaml config --quiet
      - run: docker compose -f compose.beacon.yaml -f compose.dev.yaml config --quiet
      - run: docker build -t beacon-check .
      - run: docker run --rm --network none beacon-check version
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/single-sas-smoke.py
      - run: docker build --target integration -t beacon-managed-integration .
      - run: python3 tools/managed-compose-smoke.py
