name: native-release
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go test ./...
      - name: Build Linux binaries
        shell: bash
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -mod=vendor -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/rf-link-server-beacon_linux_$arch ./cmd/rf-link-server-beacon
          done
          (cd dist && sha256sum rf-link-server-beacon_linux_* > SHA256SUMS)
          dist/rf-link-server-beacon_linux_amd64 version
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: dist
      - name: Package deployment files
        run: |
          mkdir deploy-bundle
          sed "s|rf-link-server-beacon:v0.2.0|rf-link-server-beacon:$GITHUB_REF_NAME|" compose.managed.yaml > deploy-bundle/compose.yaml
          cp .env.managed.example deploy-bundle/.env.example
          cp docs/operations/full-server.md deploy-bundle/README.md
          (cd deploy-bundle && zip ../dist/rf-link-server-compose.zip compose.yaml .env.example README.md)
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" --generate-notes
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and test release stack
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker build --target integration -t beacon-managed-integration .
          python3 tools/managed-compose-smoke.py
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && 'type=registry' || 'type=oci,dest=/tmp/beacon-linux.oci.tar' }}
          tags: ghcr.io/bi8syn/rf-link-server-beacon:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: beacon-container-linux
          path: /tmp/beacon-linux.oci.tar
