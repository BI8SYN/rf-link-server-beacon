name: native-release
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go test ./...
      - name: Build Linux binaries
        shell: bash
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -mod=vendor -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/rf-link-server-beacon_linux_$arch ./cmd/rf-link-server-beacon
          done
          (cd dist && sha256sum rf-link-server-beacon_linux_* > SHA256SUMS)
          dist/rf-link-server-beacon_linux_amd64 version
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" --generate-notes
